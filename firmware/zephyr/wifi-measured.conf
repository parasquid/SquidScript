# Measured ESP32-C3 Super Mini Wi-Fi scan/status build profile.
# This opt-in overlay enables the real Zephyr ESP32 Wi-Fi driver without
# changing the default RAM-guarded development firmware profile.

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n

CONFIG_WIFI=y
CONFIG_WIFI_USAGE_MODE_SCAN_ONLY=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_L2_WIFI_MGMT=y

# Keep this first profile focused on scan/status measurement. AP, station,
# DHCP, TCP, sockets, and credential flows should be measured separately.
CONFIG_NET_TCP=n
