CONFIG_MAIN_STACK_SIZE=4864
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=512
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=768
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=80
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_NUM_FILES=2
CONFIG_SQUIDSCRIPT_ZEPHYR_DIAGNOSTIC=y
CONFIG_POWEROFF=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=4
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=0

CONFIG_WIFI_USAGE_MODE_STA_AP=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=8
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_L2_WIFI_MGMT=y

# The canonical firmware performs low-throughput control-plane networking:
# scan/status, station connect/disconnect, AP DHCP, and small service records.
# Keep native networking pools bounded for ESP32-C3 RAM instead of using the
# Ethernet-oriented Zephyr defaults.
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# Hardware-verified stack budgets for the current ESP32-C3 Wi-Fi scope. Recheck
# before adding TCP, HTTP/server proof, AP client throughput, or bulk transfers.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=1600
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1536
CONFIG_ESP32_TIMER_TASK_STACK_SIZE=3072
CONFIG_NET_RX_STACK_SIZE=1536
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y

# The ESP32-C3 Super Mini target metadata enables Wi-Fi and BLE features
# through the build wrapper's generated target Kconfig fragment. TCP,
# HTTP/server proof, and external AP client proof remain separate measured
# work.
CONFIG_NET_TCP=n

# Current BLE support is a low-throughput peripheral/control-plane path. Keep
# host buffers bounded instead of inheriting connection-heavy defaults.
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_L2CAP_TX_BUF_COUNT=3
CONFIG_BT_ATT_TX_COUNT=3
CONFIG_BT_CONN_TX_MAX=3
CONFIG_BT_BUF_EVT_RX_COUNT=4
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_ESP32_BT_CTLR_LE_MAX_CONN=1
CONFIG_ESP32_BT_CTLR_LE_MAX_ACT=2

# BLE Object Transfer Service (GATT UUID 0x1825). The OACP feature bits the
# firmware advertises are Create + Write; Execute and Abort are OACP procedures
# that are always available and not advertised. Object Name Write lets the
# client include the staging file metadata in the OTS Object Name. This is
# the surface needed by firmware/zephyr/src/ble_ots.c.
CONFIG_BT_OTS=y
CONFIG_BT_OTS_SECONDARY_SVC=y
CONFIG_BT_OTS_OACP_CREATE_SUPPORT=y
CONFIG_BT_OTS_OACP_WRITE_SUPPORT=y
CONFIG_BT_OTS_OBJ_NAME_WRITE_SUPPORT=y
