[package]
name = "squidscript-fw-x4"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
squidscript-fw-core = { path = "../squidscript-fw-core" }
squid-device-protocol = { path = "../../../../compiler/rust/crates/squid-device-protocol", default-features = false }
squidvm-core = { path = "../../../../compiler/rust/crates/squidvm-core", default-features = false }
embedded-hal = "1.0"
embedded-hal-async = "1.0"
heapless = "0.8"
binbook-core = { path = "../../../../../binbook/crates/binbook-core", optional = true }
binbook-decompress = { path = "../../../../../binbook/crates/binbook-decompress", optional = true }
embedded-sd-storage = { path = "../../../../../binbook/crates/embedded-sd-storage", optional = true }
embedded-sdmmc = { version = "0.9.0", optional = true }
gray2-render = { path = "../../../../../binbook/crates/gray2-render", optional = true }
ssd1677-driver = { path = "../../../../../binbook/crates/ssd1677-driver", optional = true }
xteink-x4-display = { path = "../../../../../binbook/crates/xteink-x4-display", optional = true }

[dev-dependencies]
binbook-encode = { path = "../../../../../binbook/crates/binbook-encode" }
embassy-sync-07 = { package = "embassy-sync", version = "0.7" }

[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-backtrace = { version = "0.19.0", features = ["esp32c3", "panic-handler", "println"], optional = true }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"], optional = true }
esp-alloc = { version = "0.10.0", default-features = true, features = ["internal-heap-stats"], optional = true }
esp-hal = { version = "1.1.1", features = ["esp32c3", "unstable"], optional = true }
esp-println = { version = "0.17.0", default-features = false, features = ["esp32c3", "jtag-serial"], optional = true }
esp-radio = { version = "=1.0.0-beta.0", default-features = false, optional = true }
esp-rtos = { version = "0.3.0", features = ["esp32c3", "embassy"], optional = true }
static_cell = { version = "2.1.1", default-features = false, optional = true }
embassy-executor = { version = "0.10", optional = true }
embassy-time = { version = "0.5.0", optional = true }
embassy-futures = { version = "0.1.2", optional = true }
embassy-sync-07 = { package = "embassy-sync", version = "0.7", optional = true }
bt-hci = { version = "0.8", optional = true, features = ["uuid"] }
trouble-host = { version = "0.6", default-features = false, optional = true, features = ["peripheral", "gatt", "derive", "connection-params-update", "default-packet-pool", "default-packet-pool-mtu-27", "default-packet-pool-size-32"] }
heapless-09 = { package = "heapless", version = "0.9", optional = true }

[features]
default = []
firmware-bin = [
    "dep:esp-backtrace",
    "dep:esp-bootloader-esp-idf",
    "dep:esp-hal",
    "dep:esp-println",
    "dep:embassy-time",
    "dep:embassy-futures",
    "dep:static_cell",
]
wifi = [
    "firmware-bin",
    "dep:embassy-executor",
    "dep:esp-alloc",
    "dep:esp-radio",
    "dep:esp-rtos",
    "esp-rtos/esp-alloc",
    "esp-rtos/esp-radio",
    "esp-radio/esp32c3",
    "esp-radio/unstable",
    "esp-radio/wifi",
]
ble = [
    "firmware-bin",
    "dep:bt-hci",
    "dep:embassy-executor",
    "dep:embassy-sync-07",
    "dep:esp-alloc",
    "dep:esp-radio",
    "dep:esp-rtos",
    "dep:trouble-host",
    "dep:heapless-09",
    "esp-rtos/esp-alloc",
    "esp-rtos/esp-radio",
    "esp-radio/ble",
    "esp-radio/esp32c3",
    "esp-radio/unstable",
]
radio-probe = ["wifi", "ble", "esp-radio/coex"]
vm-radio-measure = ["radio-probe"]
native-radio-services = ["radio-probe"]
alloc-trace = ["esp-alloc/alloc-hooks"]
x4-storage = [
    "dep:embedded-sd-storage",
    "dep:embedded-sdmmc",
]
x4-binbook = [
    "dep:binbook-core",
    "dep:binbook-decompress",
    "dep:gray2-render",
    "dep:ssd1677-driver",
    "dep:xteink-x4-display",
    "x4-storage",
]

[[bin]]
name = "squidscript-fw-x4"
path = "src/main.rs"
test = false
doctest = false
bench = false
required-features = ["firmware-bin"]
