[package]
name = "wifi-ap-probe"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[workspace]

[dependencies]
blocking-network-stack = { git = "https://github.com/bjoernQ/blocking-network-stack.git", rev = "b3ecefc" }
esp-alloc = { version = "0.9", default-features = false, features = ["esp32c3"] }
esp-backtrace = { version = "0.17", default-features = false, features = ["esp32c3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.3", default-features = false, features = ["esp32c3"] }
esp-hal = { version = "=1.0.0", default-features = false, features = ["esp32c3", "rt", "unstable"] }
esp-println = { version = "0.15", default-features = false, features = ["esp32c3", "jtag-serial", "log-04"] }
esp-radio = { version = "0.17", default-features = false, features = ["esp32c3", "wifi", "esp-alloc", "log-04", "smoltcp", "unstable"] }
esp-rtos = { version = "0.2", default-features = false, features = ["esp32c3", "esp-radio", "esp-alloc"] }
esp-wifi-sys = { version = "0.8.1", default-features = false, features = ["esp32c3"] }
smoltcp = { version = "0.12.0", default-features = false, features = ["medium-ethernet", "socket-raw"] }

[profile.release]
debug = true
debug-assertions = true
lto = "fat"
codegen-units = 1
